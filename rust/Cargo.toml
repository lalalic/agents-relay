[package]
name = "agents-relay-rust"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shadow backend for Agents Relay's canonical graph and SQLite contracts"

[dependencies]
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
tempfile = "3.23"
