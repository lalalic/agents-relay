# Canonical Rust runtime crate for Agents Relay (CLI, daemon and native tests).
[package]
name = "agents-relay-rust2"
version = "2.0.269"
edition = "2021"

[dependencies]
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "json"] } # Native TLS/HTTP Events Bus API client.
url = "2.5.8" # URL encoding for Events Bus cursor paging.
serde = { version = "1", features = ["derive"] } # Browser Pool wire snapshots use camelCase JSON.

serde_json = { version = "1", features = ["preserve_order"] }
libc = "0.2" # POSIX locale collation on macOS.
regex = "1.13" # Worker rejection regex semantics, including mixed separators.
sha2 = "0.10"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] } # ISO timestamps for dashboard JEL.

rusqlite = { version = "0.37.0", features = ["backup"] } # Native SQLite online backup and atomic migration.

[[bin]]
name = "relay-rust2-parity"
path = "src/bin/relay-rust2-parity.rs"
