<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rust Relay Live · Agents Relay</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#10151b;color:#e8edf2}
*{box-sizing:border-box}body{max-width:1080px;margin:auto;padding:24px 16px}
header{display:flex;align-items:center;gap:15px;flex-wrap:wrap}h1{font-size:1.45rem;margin:0}
p,.muted{color:#9eacb9;font-size:.87rem}.pill{border-radius:20px;background:#183528;color:#b3e4c8;padding:6px 10px;font-size:.8rem}
nav{display:flex;gap:14px;align-items:center;margin-left:auto}a{color:#a6c8fd;text-decoration:none}
button{font:inherit;color:inherit;background:#253343;border:1px solid #3a4a5e;padding:8px 13px;border-radius:9px;cursor:pointer}
section{margin-top:20px;border:1px solid #354252;border-radius:13px;overflow:hidden;background:#18212b}
h2{font-size:1rem;margin:0;padding:13px 16px;background:#1d2835}
#list{padding:6px 16px}.job{padding:14px 0;border-bottom:1px solid #334052}
.job:last-child{border:0}.job summary{cursor:pointer;font-weight:600}
.state{font-size:.79rem;font-weight:600;color:#92bfff}.state.complete{color:#a6daba}
.task{font-size:.86rem;padding:6px 0;display:flex;justify-content:space-between;gap:15px}
.detail{padding:9px 16px}
</style></head><body>
<header><h1>Rust Relay Live</h1><span class="pill">Native Rust Scheduler</span>
<nav><a href="../">Main Dashboard</a><button id="refresh" type="button">Refresh</button></nav></header>
<p>Persistent Rust-owned Jobs · read-only dashboard · no automatic human approval or publishing.</p>
<section><h2>Rust Jobs</h2><div id="list" aria-live="polite">Loading...</div></section>
<p id="status" role="status" class="muted"></p>
<script>
'use strict';
const list=document.getElementById('list'),status=document.getElementById('status');
function el(tag,cls,text){const node=document.createElement(tag);node.className=cls||'';if(text!==undefined)node.textContent=String(text);return node}
function render(jobs){
 list.replaceChildren();
 if(!jobs.length){list.append(el('p','muted','No Rust Jobs yet. Use native CLI to create a Job.'));return}
 for(const job of jobs){
  const details=el('details','job'),head=el('summary','', '#'+job.id+' · '+job.title+'  ('+job.state+')');
  details.append(head);
  const tasks=el('div','detail');
  for(const task of job.tasks||[]){const line=el('div','task');line.append(el('span','', '#'+task.id+' · '+(task.title||task.agent||'Task')),el('span','state',task.state));tasks.append(line)}
  details.append(tasks);list.append(details);
 }
}
async function load(){
 try{
  const response=await fetch('api/jobs',{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);
  const data=await response.json();if(data.backend!=='rust-native')throw Error('Unexpected backend');
  render(data.jobs||[]);status.textContent='Rust backend connected · '+(data.jobs||[]).length+' Jobs · '+new Date().toLocaleTimeString();
 }catch(error){status.textContent='Rust backend unavailable: '+error.message}
}
document.getElementById('refresh').addEventListener('click',load);load();setInterval(load,3000);
</script></body></html>
