name: Build, test, and publish

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: npm-publish-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify npm OIDC support
        run: |
          npm_version="$(npm --version)"
          echo "npm $npm_version"
          node -e 'const [major, minor] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && minor < 5)) process.exit(1)' "$npm_version"
      - run: npm ci
      - name: Run test suite
        timeout-minutes: 10
        run: npm run test:publish
      - run: chmod +x dist/cli.js dist/relayd.js
      - name: Select next package version
        id: version
        shell: bash
        run: |
          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT
          if current="$(npm view agents-relay version --registry=https://registry.npmjs.org 2>"$error_file")"; then
            :
          elif grep -q 'E404' "$error_file"; then
            current=""
          else
            cat "$error_file" >&2
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            package_version="$(node -p "require('./package.json').version")"
            next="$(node scripts/npm-version.mjs "$current" "$package_version")"
            if npm view "agents-relay@$next" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
              current="$next"
              continue
            fi
            break
          done
          if npm view "agents-relay@$next" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo 'Unable to find an unused npm patch version after five attempts' >&2
            exit 1
          fi
          if [ "$package_version" != "$next" ]; then
            npm version "$next" --no-git-tag-version --ignore-scripts
          else
            echo "package.json is already $next; publishing the initial version without rewriting it."
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
      - name: Verify package contents
        run: |
          test -x dist/cli.js
          test -x dist/relayd.js
          npm pack --dry-run --json > pack.json
          node -e 'const pack = require("./pack.json")[0]; const bins = new Map(pack.files.map(file => [file.path, file.mode])); for (const file of ["dist/cli.js", "dist/relayd.js"]) { if (bins.get(file) !== 0o755) throw new Error(`${file} is not executable in the package`); }'
      - name: Publish package
        shell: bash
        run: |
          set -o pipefail
          publish_error="$(mktemp)"
          trap 'rm -f "$publish_error"' EXIT
          if npm publish --access public 2> >(tee "$publish_error" >&2); then
            exit 0
          fi
          if grep -Eq 'EPUBLISH|previously published|cannot publish over|previously staged version' "$publish_error"; then
            echo "agents-relay@${{ steps.version.outputs.version }} is already published or staged; treating this run as idempotent."
            exit 0
          fi
          exit 1
      - name: Wait until exact published version is pullable
        shell: bash
        run: |
          expected="${{ steps.version.outputs.version }}"
          for attempt in $(seq 1 150); do
            observed="$(npm view "agents-relay@$expected" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
            if [ "$observed" = "$expected" ]; then
              echo "agents-relay@$expected is pullable from npm."
              exit 0
            fi
            sleep 2
          done
          echo "agents-relay@$expected did not become pullable from npm in the bounded publish window." >&2
          exit 1
      - name: Tag published version
        shell: bash
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --refs origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists; leaving the existing release tag in place."
            exit 0
          fi
          git tag "$tag"
          git push origin "refs/tags/$tag"
      - name: Record package publication on originating PR
        run: node scripts/report-package-published.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          PACKAGE_REGISTRY: https://registry.npmjs.org
